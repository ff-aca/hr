<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HR Group 업무 성향 검사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column of hand-outlined cards on a warm paper ground, crayon doodles in the header; DISC = red / orange / green / blue, as in the workshop card */
:root{
  --bg:#efeee9; --surface:#fbfaf7; --fg:#202722; --muted:#5d665f; --line:#202722; --hair:#d8d6cf; --soft:#e6e4dd;
  --accent:#1f7a3f; --on-accent:#fbfaf7;
  --d:#e0362b; --i:#e07a12; --s:#2f8f45; --c:#3a63d6;
  --d-bg:#fbe3df; --i-bg:#fdecd6; --s-bg:#e1f1e3; --c-bg:#e2e9fb;
  --font-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mark:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --font-hand:"Jua","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171c18; --surface:#212823; --fg:#ecefe8; --muted:#a3ada5; --line:#cfd6cc; --hair:#3a433c; --soft:#2b332d;
  --accent:#6fcf8c; --on-accent:#14301d;
  --d:#ff6f63; --i:#ffab4d; --s:#6fcf8c; --c:#7d9cff;
  --d-bg:#3d2220; --i-bg:#3b2c18; --s-bg:#1f3626; --c-bg:#222c4a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171c18; --surface:#212823; --fg:#ecefe8; --muted:#a3ada5; --line:#cfd6cc; --hair:#3a433c; --soft:#2b332d;
  --accent:#6fcf8c; --on-accent:#14301d;
  --d:#ff6f63; --i:#ffab4d; --s:#6fcf8c; --c:#7d9cff;
  --d-bg:#3d2220; --i-bg:#3b2c18; --s-bg:#1f3626; --c-bg:#222c4a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px;margin:0}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:34px 8px 6px}
header .doodle{position:absolute;pointer-events:none}
.eyebrow{font-family:var(--font-hand);font-size:20px;color:var(--i)}
h1{font-family:var(--font-mark);font-weight:400;font-size:clamp(34px,8vw,52px);line-height:1.12;margin:0;color:var(--accent);text-wrap:balance}
h2{font-family:var(--font-hand);font-weight:400;font-size:24px;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.letters{display:flex;gap:8px;margin-top:8px}
.letters span{font-family:var(--font-mark);font-size:18px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;border:2.5px solid var(--line)}
.bgD{background:var(--d)}.bgI{background:var(--i)}.bgS{background:var(--s)}.bgC{background:var(--c)}
nav{display:flex;gap:6px;background:var(--surface);padding:5px;border-radius:999px;border:2.5px solid var(--line)}
nav button{flex:1;border:0;background:transparent;color:var(--muted);font-family:var(--font-hand);font-size:17px;padding:9px 6px;border-radius:999px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
button:focus-visible{outline:3px solid var(--i);outline-offset:2px}
.panel{background:var(--surface);border:2.5px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.btn{border:2.5px solid var(--line);font-family:var(--font-hand);font-size:18px;padding:11px 20px;border-radius:999px;cursor:pointer;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--surface);color:var(--fg)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:space-between}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.note{font-size:13px;color:var(--muted);background:var(--soft);border-radius:14px;padding:12px 14px}
/* quiz */
.progress{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;border:2px solid var(--line)}
.progress i{display:block;height:100%;background:var(--s);transition:width .25s}
.qnum{font-family:var(--font-mark);font-size:16px;color:var(--accent);font-variant-numeric:tabular-nums}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--surface);border:2px dashed var(--hair);border-radius:16px;padding:15px 16px;cursor:pointer;line-height:1.55;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt.on{border:2.5px solid var(--line);background:var(--s-bg);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
/* results */
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.badge{font-family:var(--font-mark);font-size:38px;line-height:1;padding:16px 18px;border-radius:20px;color:#fff;min-width:84px;text-align:center;border:2.5px solid var(--line)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:76px 1fr 42px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:99px}
.bar b{font-variant-numeric:tabular-nums;text-align:right;font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:540px){.grid2{grid-template-columns:1fr}}
.box{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;background:var(--soft)}
.box h3{font-family:var(--font-hand);font-weight:400;font-size:16px;color:var(--accent)}
.manual{border:2.5px dashed var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;background:var(--i-bg)}
.manual h3{font-family:var(--font-hand);font-weight:400;font-size:18px}
.manual li{color:var(--fg)}
/* group */
.mapwrap{overflow-x:auto}
svg text{font-family:var(--font-body)}
.groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:480px){.groups{grid-template-columns:1fr}}
.grp{border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.grp-h{display:flex;align-items:center;gap:8px;font-family:var(--font-hand);font-size:16px}
.grp-h b{font-family:var(--font-mark);font-weight:400;font-size:18px}
.grp-h small{margin-left:auto;font-family:var(--font-body);font-size:12px;font-weight:700;opacity:.8}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--surface);color:var(--fg);border-radius:999px;padding:3px 10px 3px 4px;font-size:13px;max-width:100%}
.pill i{font-style:normal;font-family:var(--font-mark);font-size:11px;color:#fff;border-radius:999px;padding:1px 6px}
.pill.me{outline:2px solid var(--line)}
.pill.empty{background:transparent;color:var(--muted);padding:3px 0}
button.pill{border:0;font:inherit;font-size:13px;cursor:pointer}
button.pill:hover{box-shadow:0 0 0 2px var(--accent)}
button.pill.sel{box-shadow:0 0 0 2.5px var(--line);font-weight:700}
.dot{cursor:pointer}
.hint{font-family:var(--font-hand);font-size:16px;color:var(--accent);text-align:center}
.pd{border:2.5px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;background:var(--surface);scroll-margin-top:16px}
.pd .hero .badge{font-size:30px;padding:12px 14px;min-width:70px}
.pd .x{margin-left:auto;align-self:flex-start;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;width:32px;height:32px;cursor:pointer;font-size:16px;line-height:1}
.counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.count{border-radius:14px;padding:10px;text-align:center}
.count b{display:block;font-family:var(--font-mark);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.count small{font-size:12px;font-weight:700}
.cD{background:var(--d-bg);color:var(--d)}.cI{background:var(--i-bg);color:var(--i)}.cS{background:var(--s-bg);color:var(--s)}.cC{background:var(--c-bg);color:var(--c)}
.status{font-size:13px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--font-hand);font-size:16px;color:var(--accent)}
.field input,.field select{font:inherit;font-size:16px;padding:11px 14px;border-radius:14px;border:2.5px solid var(--line);background:var(--surface);color:var(--fg)}
.fields{display:grid;grid-template-columns:2fr 1fr;gap:10px}
@media (max-width:480px){.fields{grid-template-columns:1fr}}
@media (max-width:480px){header .doodle.sun{width:64px;height:64px;right:-6px}header .doodle.flower{width:70px;height:70px;left:-14px}}
@media (prefers-reduced-motion:reduce){.progress i{transition:none}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <svg class="doodle flower" style="left:-24px;top:-14px" width="104" height="104" viewBox="0 0 230 230" aria-hidden="true">
      <g fill="#e8352b"><circle cx="115" cy="55" r="52"/><circle cx="175" cy="105" r="52"/><circle cx="150" cy="175" r="52"/><circle cx="78" cy="175" r="52"/><circle cx="55" cy="105" r="52"/></g>
      <circle cx="115" cy="122" r="34" fill="#f7c928"/><circle cx="115" cy="122" r="16" fill="#3a63d6"/>
    </svg>
    <svg class="doodle sun" style="right:-8px;top:-4px" width="86" height="86" viewBox="0 0 190 190" aria-hidden="true">
      <g stroke="#f7c928" stroke-width="14" stroke-linecap="round"><line x1="95" y1="8" x2="95" y2="36"/><line x1="95" y1="154" x2="95" y2="182"/><line x1="8" y1="95" x2="36" y2="95"/><line x1="154" y1="95" x2="182" y2="95"/><line x1="33" y1="33" x2="53" y2="53"/><line x1="137" y1="137" x2="157" y2="157"/><line x1="157" y1="33" x2="137" y2="53"/><line x1="53" y1="137" x2="33" y2="157"/></g>
      <circle cx="95" cy="95" r="44" fill="#f7c928"/>
    </svg>
    <div class="eyebrow">HR Group 워크숍 · 나 사용 설명서</div>
    <h1>우리는 어떻게<br>일하는 사람일까?</h1>
    <p class="muted">DISC 이론을 바탕으로 만든 16문항 업무 성향 검사예요. 5분 정도 걸려요.</p>
    <div class="letters" aria-hidden="true"><span class="bgD">D</span><span class="bgI">I</span><span class="bgS">S</span><span class="bgC">C</span></div>
  </header>

  <nav role="tablist">
    <button role="tab" id="tab-test" aria-selected="true" data-view="test">검사하기</button>
    <button role="tab" id="tab-me" aria-selected="false" data-view="me">내 결과</button>
    <button role="tab" id="tab-group" aria-selected="false" data-view="group">우리 그룹</button>
  </nav>

  <section id="view-test" class="panel"></section>
  <section id="view-me" class="panel" hidden></section>
  <section id="view-group" class="panel" hidden></section>
</div>

<script>
const TYPES = {
  D:{name:"주도형",en:"Dominance",kw:"결과 · 속도 · 도전",
     summary:"목표가 보이면 가장 먼저 움직이는 사람이에요. 결정을 미루지 않고, 어려운 문제일수록 힘이 나요.",
     strengths:["빠른 결단과 실행력","어려운 문제에 정면으로 부딪히는 용기","방향이 흐릴 때 기준을 세워줌"],
     energy:["권한과 재량이 주어질 때","성과가 눈에 보일 때","도전적인 목표가 있을 때"],
     watch:["속도를 내다 주변을 놓칠 수 있어요","직설적인 말이 차갑게 들릴 수 있어요"],
     tips:["결론과 핵심부터 말해 주세요","선택지를 주고 결정하게 해 주세요","돌려 말하기보다 솔직한 게 편해요"]},
  I:{name:"사교형",en:"Influence",kw:"사람 · 열정 · 아이디어",
     summary:"사람들과 함께할 때 에너지가 차오르는 사람이에요. 분위기를 띄우고 아이디어로 다른 사람을 움직여요.",
     strengths:["팀의 분위기와 에너지를 끌어올림","아이디어 발산과 설득","처음 보는 사람과도 금방 친해짐"],
     energy:["인정과 칭찬을 받을 때","사람들과 함께 일할 때","새롭고 재미있는 시도를 할 때"],
     watch:["디테일과 마무리가 약해질 수 있어요","하고 싶은 일이 많아 우선순위가 흔들릴 수 있어요"],
     tips:["아이디어에 먼저 반응해 주세요","혼자 오래 두기보다 같이 이야기해 주세요","마감과 세부사항은 가볍게 리마인드해 주세요"]},
  S:{name:"안정형",en:"Steadiness",kw:"협력 · 신뢰 · 꾸준함",
     summary:"팀이 흔들리지 않게 받쳐주는 사람이에요. 다른 사람을 잘 듣고, 맡은 일은 끝까지 꾸준히 해내요.",
     strengths:["경청과 배려","꾸준하고 믿을 수 있는 실행","갈등을 부드럽게 완화함"],
     energy:["예측 가능하고 안정적인 환경","서로 돕는 팀 분위기","충분히 준비할 시간이 있을 때"],
     watch:["싫다는 말을 잘 못해 혼자 떠안을 수 있어요","갑작스러운 변화에 부담을 느낄 수 있어요"],
     tips:["변화는 이유와 함께 미리 알려 주세요","의견을 먼저 물어봐 주세요 (먼저 말하지 않을 수 있어요)","고마움을 자주 표현해 주세요"]},
  C:{name:"신중형",en:"Conscientiousness",kw:"정확 · 품질 · 분석",
     summary:"제대로 하는 것이 중요한 사람이에요. 근거와 기준을 세우고, 다른 사람이 놓친 빈틈을 찾아내요.",
     strengths:["꼼꼼한 분석과 품질 관리","체계와 기준을 만듦","리스크를 미리 발견함"],
     energy:["명확한 기준과 정보가 있을 때","깊이 몰입할 시간이 있을 때","전문성을 인정받을 때"],
     watch:["완벽을 기하다 속도가 늦어질 수 있어요","비판이 날카롭게 들릴 수 있어요"],
     tips:["근거와 자료를 함께 주세요","생각할 시간을 주세요 (즉답을 요구하지 않기)","감정보다 사실 중심으로 피드백해 주세요"]}
};
const ORDER = ["D","I","S","C"];

const Q = [
  ["새 프로젝트를 맡으면 나는", {D:"목표와 마감부터 정하고 바로 착수한다",I:"같이 할 사람들과 아이디어부터 신나게 나눈다",S:"팀원들 상황을 살피며 무리 없는 계획을 세운다",C:"자료와 사례를 충분히 찾아 기준부터 정리한다"}],
  ["회의에서 나는", {D:"결론이 안 나면 답답해서 정리하자고 말한다",I:"말을 많이 하는 편이고 아이디어를 던진다",S:"다른 사람 의견을 잘 듣고 맞춰주는 편이다",C:"근거나 숫자가 틀린 부분이 먼저 눈에 들어온다"}],
  ["가장 기분 좋은 칭찬은", {D:"\"추진력 대단해요, 결국 해냈네요\"",I:"\"덕분에 분위기가 확 살았어요\"",S:"\"늘 든든하게 챙겨줘서 고마워요\"",C:"\"꼼꼼하게 봐줘서 실수가 없었어요\""}],
  ["의견 충돌이 생기면", {D:"정면으로 이야기해서 빨리 정리한다",I:"가볍게 풀면서 관계가 상하지 않게 한다",S:"일단 한발 물러서서 상황이 가라앉길 기다린다",C:"사실관계를 정리해 논리적으로 설명한다"}],
  ["스트레스를 받으면", {D:"예민해지고 혼자 밀어붙인다",I:"누군가에게 털어놓으며 푼다",S:"티를 잘 안 내고 속으로 쌓아둔다",C:"더 파고들며 완벽하게 하려 한다"}],
  ["일을 고를 수 있다면", {D:"어렵지만 성과가 확실히 보이는 일",I:"여러 사람을 만나고 설득하는 일",S:"팀이 안정적으로 굴러가게 돕는 일",C:"전문성을 깊게 쌓을 수 있는 일"}],
  ["갑자기 변화가 생기면", {D:"기회라고 보고 먼저 움직인다",I:"새롭고 재밌을 것 같아 기대된다",S:"충분한 설명과 준비 시간이 있었으면 한다",C:"왜 바뀌는지 근거부터 확인하고 싶다"}],
  ["결정을 내릴 때 나는", {D:"빠르게 정하고, 틀리면 고친다",I:"직감과 사람들 반응을 보고 정한다",S:"관련된 사람들이 괜찮은지 확인하고 정한다",C:"대안을 비교·분석한 뒤 정한다"}],
  ["동료들이 나에게 자주 하는 말", {D:"\"결단력 있다\"",I:"\"에너지 넘친다\"",S:"\"같이 있으면 편하다\"",C:"\"정확하다\""}],
  ["피드백을 줄 때 나는", {D:"돌려 말하지 않고 핵심만 말한다",I:"좋은 점부터 말하며 분위기를 살린다",S:"상대가 상처받지 않을지 먼저 고민한다",C:"구체적인 예시와 기준을 들어 설명한다"}],
  ["가장 힘 빠지는 상황은", {D:"결정이 계속 미뤄지고 진척이 없을 때",I:"혼자 조용히 오래 일해야 할 때",S:"일정이 갑자기 바뀌고 어수선할 때",C:"대충 처리되고 기준이 없을 때"}],
  ["내 메신저 스타일은", {D:"짧고 용건만",I:"이모지와 감탄사 듬뿍",S:"정중하고 배려하는 말투",C:"번호 매긴 정리와 첨부 자료"}],
  ["워크숍에서 맡고 싶은 역할", {D:"진행하고 결론 내는 리드",I:"아이스브레이킹 담당 분위기 메이커",S:"사람들 챙기고 빈 곳 메우기",C:"기록하고 정리해서 공유하기"}],
  ["목표를 세울 때 나는", {D:"도전적으로, 높게",I:"신나고 의미 있게",S:"현실적으로, 지킬 수 있게",C:"구체적이고 측정 가능하게"}],
  ["내 일하는 속도는", {D:"빠르게 치고 나간다",I:"몰입하면 빠르지만 들쭉날쭉하다",S:"일정한 페이스로 꾸준히 간다",C:"신중하게, 확인하면서 간다"}],
  ["회의가 이렇게 끝나면 좋다", {D:"\"그럼 누가 언제까지 하는 걸로 하죠\"",I:"\"오늘 재밌었어요, 또 해요\"",S:"\"다들 괜찮으시죠? 무리 없게 가요\"",C:"\"결정사항은 문서로 정리해 공유할게요\""}]
];
// fixed, varied option order per question so D isn't always first
const PERMS = [["C","I","D","S"],["S","D","C","I"],["I","C","S","D"],["D","S","I","C"]];
const N = Q.length;

/* ===== 설정: 구글 폼 · 시트 연결 (README 참고) ===== */
const CONFIG = {
  FORM_ACTION: "https://docs.google.com/forms/d/e/1FAIpQLSfigUnHFU1h8xzqrxuxCo3J7xtmgj_fSUoO3J5S0gSQ_-g15Q/formResponse",
  ENTRY: { name:"entry.308201489", team:"entry.265574119", D:"entry.1785974881", I:"entry.2081939765", S:"entry.1367366812", C:"entry.1376595390", type:"entry.495408514" },
  SHEET_CSV: "https://docs.google.com/spreadsheets/d/e/2PACX-1vR7u1fgQijkRFQMbHbxU2eFRQJ5mIM1sNOuwY-RfR8HjYtakXkZd4Z9lcLKFl1O6iBp0TfHAXBJ7YaC/pub?gid=1942822617&single=true&output=csv"
};
const TEAMS = ["PP팀","RBP팀","그룹장"];
const blank=()=>Array.from({length:N},()=>({}));
const LS_KEY="disc-result-v3";
let state = {view:"test", step:-1, answers:blank(), result:null};
let groupDocs=[], groupStatus="idle", profile=lsGet("disc-profile")||{name:"",team:""};

function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

// one pick per question; a type's score = how many times it was picked (0..16)
function score(answers){
  const r={D:0,I:0,S:0,C:0};
  answers.forEach(a=>{ if(a.pick) r[a.pick]++; });
  return r;
}
function rank(r){ return ORDER.slice().sort((a,b)=> r[b]-r[a] || ORDER.indexOf(a)-ORDER.indexOf(b)); }
function pct(v){ return Math.round(v/N*100); }
function label(r){ const k=rank(r); return (r[k[0]]-r[k[1]]>=3)? k[0] : k[0]+k[1]; }
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

/* ---------- views ---------- */
function show(view){
  state.view=view;
  ["test","me","group"].forEach(v=>{
    document.getElementById("view-"+v).hidden = v!==view;
    document.getElementById("tab-"+v).setAttribute("aria-selected", v===view);
  });
  render();
}
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>show(b.dataset.view)));

function render(){
  if(state.view==="test") renderTest();
  if(state.view==="me") renderMe();
  if(state.view==="group") renderGroup();
}

function renderTest(){
  const el=document.getElementById("view-test");
  if(state.step<0){
    el.innerHTML=`
      <h2>검사 방법</h2>
      <p>문항마다 네 개의 보기가 있어요. <b>평소 내 모습과 가장 가까운 것 하나</b>를 눌러 주세요. 누르면 다음 문항으로 넘어가요.</p>
      <ul class="plain">
        <li>회사에서 일할 때의 평소 내 모습을 기준으로 답해 주세요.</li>
        <li>둘 다 맞는 것 같으면 조금이라도 더 나다운 쪽을 고르세요.</li>
        <li>정답이나 좋은 유형은 없어요. 오래 고민하지 말고 먼저 떠오르는 쪽으로 고르세요.</li>
        <li>다 하면 내 결과가 바로 나오고, '우리 그룹' 탭에 이름과 함께 표시돼요.</li>
      </ul>
      <div class="note">이 검사는 워크숍에서 서로를 알아가기 위해 DISC 이론을 바탕으로 자체 제작한 도구예요. <br>공식 진단 검사가 아니니 결과는 대화의 출발점으로 가볍게 활용해 주세요.</div>
      <div class="fields">
        <div class="field"><label for="nm">이름</label><input id="nm" maxlength="20" placeholder="예: 구연정" value="${esc(profile.name)}"></div>
        <div class="field"><label for="tm">팀</label><select id="tm"><option value="">선택</option>${TEAMS.map(t=>`<option ${profile.team===t?"selected":""}>${t}</option>`).join("")}</select></div>
      </div>
      <div class="row"><button class="btn" id="start">검사 시작하기</button>${state.result?'<button class="btn ghost" id="seeme">내 결과 보기</button>':''}</div>`;
    const nmEl=el.querySelector("#nm"), tmEl=el.querySelector("#tm"), st=el.querySelector("#start");
    const chk=()=>{ st.disabled=!(nmEl.value.trim()&&tmEl.value); };
    nmEl.oninput=chk; tmEl.onchange=chk; chk();
    st.onclick=()=>{ profile={name:nmEl.value.trim(),team:tmEl.value}; lsSet("disc-profile",profile); state.step=0; state.answers=blank(); renderTest(); };
    const sm=el.querySelector("#seeme"); if(sm) sm.onclick=()=>show("me");
    return;
  }
  const i=state.step, [q,opts]=Q[i], a=state.answers[i], perm=PERMS[i%4];
  el.innerHTML=`
    <div class="row end"><span class="qnum">Q${i+1} / ${N}</span><span class="qnum">${Math.round((i/N)*100)}%</span></div>
    <div class="progress" aria-hidden="true"><i style="width:${(i/N)*100}%"></i></div>
    <h2>${esc(q)}</h2>
    <div class="opts" role="radiogroup" aria-label="${esc(q)}">${perm.map(k=>`
      <button class="opt ${a.pick===k?'on':''}" data-k="${k}" role="radio" aria-checked="${a.pick===k}">${esc(opts[k])}</button>`).join("")}
    </div>
    <div class="row end">
      <button class="btn ghost" id="prev">${i===0?'처음으로':'이전'}</button>
      ${a.pick?`<button class="btn" id="next">${i===N-1?'결과 보기':'다음'}</button>`:''}
    </div>`;
  let busy=false;
  const advance=()=>{ if(i<N-1){state.step++; renderTest(); window.scrollTo({top:0});} else finish(); };
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(busy) return; busy=true;
    a.pick=b.dataset.k;
    el.querySelectorAll(".opt").forEach(x=>{const on=x===b; x.classList.toggle("on",on); x.setAttribute("aria-checked",on);});
    setTimeout(advance, 220);
  });
  el.querySelector("#prev").onclick=()=>{state.step--; renderTest();};
  const nx=el.querySelector("#next"); if(nx) nx.onclick=advance;
}

async function finish(){
  const r=score(state.answers);
  state.result={...r, type:label(r), at:Date.now()};
  lsSet(LS_KEY, state.result);
  state.step=-1;
  show("me");
  window.scrollTo({top:0});
  if(!CONFIG.FORM_ACTION){ state.saved="off"; renderMe(); return; }
  state.saved="sending"; renderMe();
  try{
    const E=CONFIG.ENTRY, body=new URLSearchParams();
    body.append(E.name, profile.name); body.append(E.team, profile.team);
    ORDER.forEach(k=>body.append(E[k], r[k])); body.append(E.type, state.result.type);
    await fetch(CONFIG.FORM_ACTION,{method:"POST",mode:"no-cors",body});
    state.saved="ok";
  }catch(e){ state.saved="fail"; }
  if(state.view==="me") renderMe();
}

function renderMe(){
  const el=document.getElementById("view-me");
  const res=state.result;
  if(!res){
    el.innerHTML=`<h2>아직 결과가 없어요</h2><p class="muted">검사를 마치면 이곳에 내 유형, 강점, 그리고 동료에게 공유할 '나 사용설명서'가 정리돼요.</p><div class="row"><button class="btn" id="go">검사하러 가기</button></div>`;
    el.querySelector("#go").onclick=()=>show("test");
    return;
  }
  const k=rank(res), main=k[0], T=TYPES[main], sub=res.type.length>1?TYPES[res.type[1]]:null;
  const savedMsg = state.saved==="ok" ? "결과가 제출됐어요. '우리 그룹'에는 몇 분 뒤에 반영돼요."
    : state.saved==="sending" ? "결과를 제출하는 중이에요…"
    : state.saved==="fail" ? "제출에 실패했어요. 인터넷 연결을 확인하고 다시 검사해 주세요."
    : state.saved==="off" ? "아직 저장 설정이 연결되지 않아 내 결과만 보여요." : "";
  el.innerHTML=`
    <div class="hero">
      <div class="badge bg${main}">${res.type}</div>
      <div style="min-width:0;flex:1 1 240px">
        <div class="eyebrow">${T.en}${sub?" + "+sub.en:""}</div>
        <h2>${T.name}${sub?` · ${sub.name} 성향도 함께`:""}</h2>
        <p class="muted">${T.kw}</p>
      </div>
    </div>
    <p>${T.summary}</p>
    <div class="bars">${ORDER.map(x=>`
      <div class="bar"><span>${x} ${TYPES[x].name}</span><div class="track"><i class="bg${x}" style="width:${pct(res[x])}%"></i></div><b>${pct(res[x])}</b></div>`).join("")}
    </div>
    <div class="grid2">
      <div class="box"><h3>나의 강점</h3><ul class="plain">${T.strengths.map(s=>`<li>${s}</li>`).join("")}</ul></div>
      <div class="box"><h3>이럴 때 힘이 나요</h3><ul class="plain">${T.energy.map(s=>`<li>${s}</li>`).join("")}</ul></div>
      <div class="box"><h3>이런 모습이 나올 수 있어요</h3><ul class="plain">${T.watch.map(s=>`<li>${s}</li>`).join("")}</ul></div>
      <div class="box"><h3>나와 일할 때 이렇게 해 주세요</h3><ul class="plain">${T.tips.map(s=>`<li>${s}</li>`).join("")}</ul></div>
    </div>
    <div class="manual">
      <h3>워크숍 공유용 · 나 사용 설명서</h3>
      <p class="muted">자기소개(인당 2~3분) 때 아래 세 가지를 이야기해 주세요.</p>
      <ul class="plain">
        <li>나의 DISC 유형과 가장 공감한 부분</li>
        <li>나를 표현하는 해시태그 3개</li>
        <li>내가 편한 소통·피드백 방식</li>
      </ul>
    </div>
    ${savedMsg?`<p class="status">${savedMsg}</p>`:""}
    <div class="row"><button class="btn ghost" id="retake">다시 검사하기</button><button class="btn" id="tog">우리 그룹 보기</button></div>`;
  el.querySelector("#retake").onclick=()=>{state.step=0; state.answers=blank(); show("test");};

async function renderGroup(){
  const el=document.getElementById("view-group");
  if(!CONFIG.SHEET_CSV){
    el.innerHTML=`<h2>우리 그룹</h2><p class="muted">아직 결과 시트가 연결되지 않았어요.</p>`; return;
  }
  if(groupStatus==="idle"){ loadGroup(); }
  if(groupStatus==="loading"){
    el.innerHTML=`<h2>우리 그룹</h2><p class="muted">그룹 결과를 불러오는 중이에요…</p>`; return;
  }
  if(groupStatus==="fail"){
    el.innerHTML=`<h2>우리 그룹</h2><p class="muted">결과를 불러오지 못했어요. 잠시 뒤 다시 시도해 주세요.</p><div class="row"><button class="btn" id="rl">다시 불러오기</button></div>`;
    el.querySelector("#rl").onclick=()=>{groupStatus="idle"; renderGroup();}; return;
  }
  if(!groupDocs.length){
    el.innerHTML=`<h2>우리 그룹</h2><p class="muted">아직 아무도 검사를 마치지 않았어요. 검사를 마치면 그룹원의 유형이 이곳의 성향 지도에 하나씩 표시돼요.</p><div class="row"><button class="btn" id="go">첫 번째로 검사하기</button></div>`;
    el.querySelector("#go").onclick=()=>show("test");
    return;
  }
  const isMe=d=>profile.name && d.name===profile.name && d.team===profile.team;
  const key=d=>d.name+"|"+d.team;
  const counts={D:0,I:0,S:0,C:0}; groupDocs.forEach(d=>counts[rank(d)[0]]++);
  // map: x = 사람(+) vs 일(-), y = 빠름(+) vs 신중(-)
  const W=360,H=360,P=34,cx=W/2,cy=H/2,R=(W-2*P)/2;
  const dots=groupDocs.map((d,ix)=>{
    // pick counts (0..16, sum 16); pair difference spans -16..16 → -1..1
    let x=((d.I+d.S)-(d.D+d.C))/N, y=((d.D+d.I)-(d.S+d.C))/N;
    x=Math.max(-.92,Math.min(.92,x*1.3)); y=Math.max(-.92,Math.min(.92,y*1.3));
    const jx=((ix*37)%11-5)*1.4, jy=((ix*53)%11-5)*1.4;
    return {px:cx+x*R+jx, py:cy-y*R+jy, d, name:d.name, me:isMe(d)};
  });
  // spread dots that sit on top of each other
  for(let it=0;it<60;it++){
    for(let a=0;a<dots.length;a++)for(let b=a+1;b<dots.length;b++){
      const A=dots[a],B=dots[b];let dx=B.px-A.px,dy=B.py-A.py,dd=Math.hypot(dx,dy)||0.01;
      if(dd<22){const m=(22-dd)/2;dx/=dd;dy/=dd;A.px-=dx*m;A.py-=dy*m;B.px+=dx*m;B.py+=dy*m;}
    }
    dots.forEach(o=>{o.px=Math.max(P+10,Math.min(W-P-10,o.px));o.py=Math.max(P+10,Math.min(H-P-10,o.py));});
  }
  // place each name where it collides least with other names and dots
  const boxes=[];
  const ov=(a,b)=>Math.max(0,Math.min(a.x2,b.x2)-Math.max(a.x1,b.x1))*Math.max(0,Math.min(a.y2,b.y2)-Math.max(a.y1,b.y1));
  dots.forEach(o=>boxes.push({x1:o.px-8,x2:o.px+8,y1:o.py-8,y2:o.py+8}));
  dots.forEach(o=>{
    const w=(o.name.length+(o.me?4:0))*11+4, h=13;
    const cands=[[0,-12,"middle"],[0,21,"middle"],[11,4,"start"],[-11,4,"end"],[9,-9,"start"],[-9,-9,"end"],[9,17,"start"],[-9,17,"end"],[0,-26,"middle"],[0,35,"middle"]].map(([dx,dy,a])=>[o.px+dx,o.py+dy,a]);
    const bx=([x,y,a])=>{const x1=a==="middle"?x-w/2:a==="start"?x:x-w;return {x1,x2:x1+w,y1:y-h+2,y2:y+2};};
    let best=null,bestS=Infinity;
    cands.forEach((c,ci)=>{const b=bx(c);let sc=boxes.reduce((t,o2)=>t+ov(b,o2),0)+ci*0.5;
      if(b.x1<2||b.x2>W-2||b.y1<2||b.y2>H-2) sc+=1e4; if(sc<bestS){bestS=sc;best=c;}});
    [o.lx,o.ly,o.la]=best; boxes.push(bx(best));
  });
  const quad=(k,x,y,anchor)=>`<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="22" font-weight="700" fill="var(--${k.toLowerCase()})" opacity=".55" style="font-family:var(--font-mark)">${k}</text>`;
  el.innerHTML=`
    <div class="row end"><h2>우리 그룹 성향 지도</h2><span class="row"><span class="status">${groupDocs.length}명 참여</span><button class="btn ghost" id="rl" style="font-size:14px;padding:6px 14px">새로고침</button></span></div>
    <div class="mapwrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block;margin:0 auto" role="img" aria-label="그룹원 DISC 성향 지도">
      <rect x="${P}" y="${P}" width="${R}" height="${R}" fill="var(--d-bg)"/>
      <rect x="${cx}" y="${P}" width="${R}" height="${R}" fill="var(--i-bg)"/>
      <rect x="${cx}" y="${cy}" width="${R}" height="${R}" fill="var(--s-bg)"/>
      <rect x="${P}" y="${cy}" width="${R}" height="${R}" fill="var(--c-bg)"/>
      <line x1="${P}" y1="${cy}" x2="${W-P}" y2="${cy}" stroke="var(--line)"/>
      <line x1="${cx}" y1="${P}" x2="${cx}" y2="${H-P}" stroke="var(--line)"/>
      ${quad("D",P+10,P+26,"start")}${quad("I",W-P-10,P+26,"end")}${quad("S",W-P-10,H-P-10,"end")}${quad("C",P+10,H-P-10,"start")}
      <text x="${cx}" y="${P-12}" text-anchor="middle" font-size="11" fill="var(--muted)">빠름 · 주도적</text>
      <text x="${cx}" y="${H-P+22}" text-anchor="middle" font-size="11" fill="var(--muted)">신중 · 차분</text>
      <text x="${P-8}" y="${cy}" text-anchor="middle" font-size="11" fill="var(--muted)" transform="rotate(-90 ${P-8} ${cy})">일 중심</text>
      <text x="${W-P+10}" y="${cy}" text-anchor="middle" font-size="11" fill="var(--muted)" transform="rotate(90 ${W-P+10} ${cy})">사람 중심</text>
      ${dots.map(o=>`<g class="dot" data-key="${esc(key(o.d))}" role="button" tabindex="0" aria-label="${esc(o.name)} 결과 보기"><circle cx="${o.px}" cy="${o.py}" r="${o.me?8:6}" fill="var(--${rank(o.d)[0].toLowerCase()})" stroke="var(--surface)" stroke-width="2"/><text x="${o.lx}" y="${o.ly}" text-anchor="${o.la}" font-size="11" font-weight="${o.me?700:500}" fill="var(--fg)">${esc(o.name)}${o.me?" (나)":""}</text></g>`).join("")}
    </svg></div>
    <div class="groups">${ORDER.map(k=>{const ms=groupDocs.filter(d=>rank(d)[0]===k);return `<div class="grp c${k}"><div class="grp-h"><b>${k}</b>${TYPES[k].name}<small>${ms.length}명</small></div><div class="pills">${ms.length?ms.map(d=>`<button class="pill${isMe(d)?" me":""}${state.sel===key(d)?" sel":""}" data-key="${esc(key(d))}"><i class="bg${rank(d)[0]}">${esc(d.type)}</i>${esc(d.name)}${isMe(d)?" (나)":""}</button>`).join(""):`<span class="pill empty">아직 없어요</span>`}</div></div>`}).join("")}</div>
    <div id="pdetail"></div>
    <p class="status">새로 제출한 결과는 몇 분 뒤에 반영돼요.</p>
    <div class="note">이야기 나눠 볼 질문: 우리 그룹에 많은 유형과 적은 유형은? 서로 다른 유형끼리 일할 때 어떤 점을 챙기면 좋을까?</div>`;
  renderDetail(false);
}

function renderDetail(scroll){
  const box=document.getElementById("pdetail"); if(!box) return;
  const d=groupDocs.find(x=>x.name+"|"+x.team===state.sel);
  document.querySelectorAll("#view-group button.pill").forEach(b=>b.classList.toggle("sel",b.dataset.key===state.sel));
  if(!d){ box.innerHTML=`<p class="hint">지도나 이름을 누르면 그 사람의 성향을 볼 수 있어요</p>`; return; }
  const k=rank(d), main=k[0], T=TYPES[main], sub=d.type.length>1?TYPES[d.type[1]]:null;
  const me=profile.name && d.name===profile.name && d.team===profile.team;
  box.innerHTML=`<div class="pd" id="pd">
    <div class="hero">
      <div class="badge bg${main}">${esc(d.type)}</div>
      <div style="min-width:0;flex:1 1 200px">
        <div class="eyebrow">${esc(d.name)}${me?" (나)":""} · ${esc(d.team)}</div>
        <h2>${T.name}${sub?` · ${sub.name} 성향도 함께`:""}</h2>
        <p class="muted">${T.kw}</p>
      </div>
      <button class="x" id="pdx" aria-label="닫기">✕</button>
    </div>
    <p>${T.summary}</p>
    <div class="bars">${ORDER.map(x=>`<div class="bar"><span>${x} ${TYPES[x].name}</span><div class="track"><i class="bg${x}" style="width:${pct(d[x])}%"></i></div><b>${pct(d[x])}</b></div>`).join("")}</div>
    <div class="grid2">
      <div class="box"><h3>강점</h3><ul class="plain">${T.strengths.map(s=>`<li>${s}</li>`).join("")}</ul></div>
      <div class="box"><h3>이럴 때 힘이 나요</h3><ul class="plain">${T.energy.map(s=>`<li>${s}</li>`).join("")}</ul></div>
    </div>
    <div class="manual"><h3>${me?"나와":esc(d.name)+"님과"} 일할 때 이렇게 해 주세요</h3><ul class="plain">${T.tips.map(s=>`<li>${s}</li>`).join("")}</ul></div>
  </div>`;
  document.getElementById("pdx").onclick=()=>{state.sel=null; renderDetail(false);};
  if(scroll) document.getElementById("pd").scrollIntoView({behavior:"smooth",block:"start"});
}
document.getElementById("view-group").addEventListener("click",e=>{
  const t=e.target.closest("[data-key]"); if(!t) return;
  state.sel = state.sel===t.dataset.key ? null : t.dataset.key; renderDetail(!!state.sel);
});
document.getElementById("view-group").addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ") && e.target.matches(".dot")){ e.preventDefault(); e.target.click(); }
});

/* ---------- group data (published Google Sheet CSV) ---------- */
function parseCSV(t){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){ if(c=='"'){ if(t[i+1]=='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c=='"') q=true; else if(c==','){row.push(f);f="";}
    else if(c=='\n'){row.push(f);rows.push(row);row=[];f="";} else if(c!='\r') f+=c; }
  if(f||row.length){row.push(f);rows.push(row);}
  return rows;
}
async function loadGroup(){
  groupStatus="loading";
  try{
    const res=await fetch(CONFIG.SHEET_CSV+(CONFIG.SHEET_CSV.includes("?")?"&":"?")+"t="+Date.now());
    if(!res.ok) throw 0;
    const rows=parseCSV(await res.text()); const h=rows.shift().map(x=>x.trim());
    const col=n=>h.indexOf(n);
    const latest={};
    rows.forEach(r=>{
      const d={name:(r[col("이름")]||"").trim(), team:(r[col("팀")]||"").trim(), type:(r[col("유형")]||"").trim()};
      ORDER.forEach(k=>d[k]=Number(r[col(k)]));
      if(!d.name || ORDER.some(k=>isNaN(d[k]))) return;
      latest[d.name+"|"+d.team]=d;   // later rows win
    });
    groupDocs=Object.values(latest); groupStatus="ok";
  }catch(e){ groupStatus="fail"; }
  if(state.view==="group") renderGroup();
}
document.addEventListener("click",e=>{ if(e.target.id==="rl" && state.view==="group" && groupStatus==="ok"){ groupStatus="idle"; renderGroup(); } });

/* ---------- boot ---------- */
state.result = lsGet(LS_KEY);
render();
</script>
